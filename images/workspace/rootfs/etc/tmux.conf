# aibox 默认 tmux 配置（个人覆盖写 ~/.tmux.conf）
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm*:extkeys"
set -g extended-keys on
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on          # OSC52：复制内容可直达 Mac 剪贴板（iTerm2/Ghostty/WezTerm）
set -g allow-passthrough on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour213,bold][aibox:#S] "
set -g status-left-length 30
set -g status-right "#[fg=colour244]Ctrl+b d 离开（程序继续运行） · Ctrl+b 数字 切换窗口 #[fg=colour250]%H:%M "
set -g status-right-length 80
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
