# 代理模式网关：mihomo TUN 全局接管 + iptables kill switch
services:
  gateway:
    build:
      context: ./images/mihomo-gateway
      args:
        MIHOMO_VERSION: ${AIBOX_MIHOMO_VERSION:-v1.19.33}
    image: aibox/gateway-mihomo:latest
    container_name: aibox-gateway
    hostname: aibox
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1
      net.ipv4.conf.all.src_valid_mark: 1
    # 仅用于识别宿主机地址并在防火墙中封禁（禁止宿主机代理作为上游）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${AIBOX_TZ:-UTC}
      NODE_FILTER: ${AIBOX_NODE_FILTER:-}
      GROUP_TYPE: ${AIBOX_GROUP_TYPE:-fallback}
      PROXY_DNS: ${AIBOX_PROXY_DNS:-}
      PROXY_SERVER_DNS: ${AIBOX_PROXY_SERVER_DNS:-}
      TEST_URL: ${AIBOX_TEST_URL:-https://www.gstatic.com/generate_204}
      ALLOW_DIRECT_CIDRS: ${AIBOX_ALLOW_DIRECT_CIDRS:-}
      INPUT_PORTS: ${AIBOX_INPUT_PORTS:-}
      LOG_LEVEL: ${AIBOX_LOG_LEVEL:-warning}
    volumes:
      - ./config/mihomo:/config:ro
      - gateway-data:/data
    restart: unless-stopped

volumes:
  gateway-data:
