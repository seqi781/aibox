# ============ 授权给容器访问的宿主机目录 ============
# 只有这里列出的路径会出现在容器中，其余宿主机文件完全不可见。
# 格式:  <rw|ro>  <宿主机路径>  [-> <容器内路径>]
#   rw  读写     ro  只读（由内核强制，容器内 root 也无法写入）
#   未指定容器内路径时，挂载到 /workspace/<目录名>
# 修改后执行 ./aibox up 生效。
#
# rw  ~/code/my-app
# ro  ~/Documents/design-specs
# ro  ~/.gitconfig  -> /home/dev/.gitconfig
